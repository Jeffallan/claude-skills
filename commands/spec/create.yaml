command: "spec:create"
phase: spec
path: commands/spec/create.md
description: docs/workflow/spec-create.md
inputs:
  - name: spec-name
    type: string
    required: true
    description: Kebab-case spec name that spec:triage grouped
outputs:
  - name: spec-files
    type: directory
    path: "{specsRoot}/todo/{spec-name}/"
    description: overview.md, implementation-plan.md and goal-prompt.md, committed on the spec branch
  - name: launch-commands
    type: report
    description: Whole-spec and next-batch goal launch commands carrying the writes-only deny set
requires:
  - ticketing
status: existing
argument-hint: "<spec-name>"
repeat: false
unattended: false
adapter-operations:
  - read
  - list-spec-tickets
  - link
  - update
  - comment
