command: "intake:document-integrations"
phase: intake
path: commands/intake/document-integrations.md
description: docs/workflow/intake-document-integrations.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: external-integrations-doc
    type: file
    path: docs/architecture/external-integrations.md
