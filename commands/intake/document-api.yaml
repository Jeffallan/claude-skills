command: "intake:document-api"
phase: intake
path: commands/intake/document-api.md
description: docs/workflow/intake-document-api.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: api-reference-doc
    type: file
    path: docs/architecture/api-reference.md
    description: "API reference for the backend surface: the `## Operations` inventory built from the framework's resolved route table (one row per method and path with a stable OP-NNN id, source app/library/framework, and the resolved permission with the setting or default behind it, plus the listing command and its route count), then per-operation entries (trigger/route/method, request or event shape, behavior, side effects, errors, auth) across REST, GraphQL, RPC, and serverless/event-triggered shapes."
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
