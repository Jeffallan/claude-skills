command: "intake:testing-setup"
phase: intake
path: commands/intake/testing-setup.md
description: docs/workflow/intake-testing-setup.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: test-harness
    type: directory
    path: (runner config, package scripts, integration-backend config, e2e driver config, tests/helpers)
    description: "A runnable test harness: a unit/component runner wired to the stack, an integration harness for the real datastore/backend, an end-to-end driver for the UI, shared fixtures/helpers, per-layer scripts, and one smoke test per layer proven to execute."
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
