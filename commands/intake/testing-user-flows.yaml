command: "intake:testing-user-flows"
phase: intake
path: commands/intake/testing-user-flows.md
description: docs/workflow/intake-testing-user-flows.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: user-flow-tests
    type: directory
    path: (integration flow tests + e2e UI specs)
    description: "End-to-end tests for critical journeys at two layers: backend flows through the real datastore/handlers (integration harness) asserting end-state and side effects, and UI flows driven through the actual screens with an e2e driver. Driver-unreachable steps stay in the backend layer; known-bug end-states are characterized and paired with a skipped intended-state test cross-referencing the finding id."
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
