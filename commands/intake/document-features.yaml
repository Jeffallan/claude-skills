command: "intake:document-features"
phase: intake
path: commands/intake/document-features.md
description: docs/workflow/intake-document-features.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: features-doc
    type: file
    path: docs/domain/features.md
    description: "Feature catalog: a Feature/Area/Key-files summary table plus per-feature subsections (what it does, user-visible behavior, implementing files), covering only features present in the code."
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
