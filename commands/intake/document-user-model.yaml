command: "intake:document-user-model"
phase: intake
path: commands/intake/document-user-model.md
description: docs/workflow/intake-document-user-model.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: user-model-doc
    type: file
    path: docs/domain/user-model.md
    description: "Primary-actor model reference: the principal entity's representations (public/own/stored), identity, lifecycle state machine (every writer of each state field as a transition, with its routes by operation id and who may call them), blocking states (operations still allowed, every way out, credentials that survive entry), completeness/validation rules, and account lifecycle. INV-2 and INV-6 breaks go to the findings tracker."
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
