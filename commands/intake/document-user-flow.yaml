command: "intake:document-user-flow"
phase: intake
path: commands/intake/document-user-flow.md
description: docs/workflow/intake-document-user-flow.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
