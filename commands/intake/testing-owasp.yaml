command: "intake:testing-owasp"
phase: intake
path: commands/intake/testing-owasp.md
description: docs/workflow/intake-testing-owasp.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: owasp-tests
    type: directory
    path: (test directory; one file per applicable OWASP category)
    description: "Adversarial tests mapped to the OWASP Top 10: each category is mapped to real surfaces in the code or marked N/A with a reason, then probed (access-control bypass, injection, insecure-design abuse, misconfiguration, auth failures). Known weaknesses are characterized and paired with a skipped hardened-behavior test cross-referencing the finding id."
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
