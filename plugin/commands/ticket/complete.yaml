command: "ticket:complete"
phase: ticket
path: plugin/commands/ticket/complete.md
description: docs/workflow/ticket-complete.md
inputs:
  - name: ticket-id
    type: string
    required: false
    description: Ticket ID to complete; optional while a ticket marker exists, since the marker names the ticket in progress
outputs:
  - name: ticket-commit
    type: file
    description: One commit holding the ticket's work, its Completion Status row and the evidence summary
requires: []
status: existing
argument-hint: "[ticket-id]"
repeat: true
unattended: true
adapter-operations: []
