command: "intake:document-codebase"
phase: intake
path: plugin/commands/intake/document-codebase.md
description: docs/workflow/intake-document-codebase.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to document. Defaults to the project root.
outputs:
  - name: docstrings
    type: directory
    description: Docstrings and module comments across the code, written for agents, with no executable line changed
  - name: documentation-report
    type: report
    description: Coverage before and after, the test run before and after, the executable-line check, and the findings raised
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
