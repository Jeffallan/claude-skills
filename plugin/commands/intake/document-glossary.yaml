command: "intake:document-glossary"
phase: intake
path: plugin/commands/intake/document-glossary.md
description: docs/workflow/intake-document-glossary.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: glossary-doc
    type: file
    path: docs/domain/glossary.md
    description: Alphabetical glossary of the project's domain and product vocabulary, every term defined and grounded in the code that defines or uses it.
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
