command: "intake:testing-authorization"
phase: intake
path: plugin/commands/intake/testing-authorization.md
description: docs/workflow/intake-testing-authorization.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: authorization-tests
    type: directory
    path: (test directory; the matrix table, the route ratchet, fixtures per principal)
    description: "Table-driven characterization tests over the access matrix: one row per operation and principal (cited by OP id and principal) with its expected outcome, plus object-level (other owner, other tenant), protected-field and state-transition rows, sent through the real request stack and re-reading stored state after every write. A route ratchet fails on any resolved route with no table row. A sample of deny rows is proven to fail with the guard removed in a scratch copy. Known bugs are characterized and paired with an expected-fail twin row carrying the finding id. A separate commit updates the matrix cell statuses in docs/security/authorization.md to [t] or [n: reason], leaving no [x]."
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
