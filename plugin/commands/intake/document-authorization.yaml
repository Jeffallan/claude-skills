command: "intake:document-authorization"
phase: intake
path: plugin/commands/intake/document-authorization.md
description: docs/workflow/intake-document-authorization.md
inputs:
  - name: directory
    type: string
    required: false
    description: Root directory to analyze. Defaults to the project root.
outputs:
  - name: authorization-doc
    type: file
    path: docs/security/authorization.md
    description: "Authorization and access-control reference: the actual authorization model (RBAC, ABAC, ownership/relationship-based, ACL, or a mix), the identity/claims basis and primitives, the principals (one column per role and per blocking state), the access invariants with cited intent evidence for each deviation, an access matrix with one row per inventory operation (outcome and status per principal, fields written, list scope, finding ids on deviating cells), and every channel to each protected object with its indirect leaks. Deviating cells become findings or Open questions in docs/intake-findings.md."
requires: []
status: existing
argument-hint: "[directory]"
repeat: true
unattended: true
adapter-operations: []
