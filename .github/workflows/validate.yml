name: Validate Skills

on:
  workflow_call:

jobs:
  validate:
    name: Validate Skills & Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skills
        run: python scripts/validate-skills.py

      - name: Validate markdown
        run: python scripts/validate-markdown.py --check

      - name: Check docs in sync
        run: python scripts/update-docs.py --check

      - name: Test plugin distribution build
        run: bash scripts/test-build-plugin-dist.sh

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm ci --prefix site
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: Check Astro formatting
        run: cd site && npx prettier --plugin prettier-plugin-astro --check "src/**/*.astro"
      - name: Check Markdown formatting
        run: npx prettier --check "skills/**/*.md" "docs/**/*.md" "*.md" "research/**/*.md"
