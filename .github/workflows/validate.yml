name: Validate Skills

on:
  workflow_call:

jobs:
  validate:
    name: Validate Skills & Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skills
        run: python scripts/validate-skills.py

      - name: Validate markdown
        run: python scripts/validate-markdown.py --check

      - name: Check docs in sync
        run: python scripts/update-docs.py --check

      - name: Test plugin distribution build
        run: bash scripts/test-build-plugin-dist.sh

  skill-linter:
    name: skill-linter (report only)
    runs-on: ubuntu-latest
    # Report-only until the findings it reports are fixed; the scripts above stay the blocking checks.
    # Each check step may fail without failing the job, so findings show in the log, not as a red check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install skill-linter==0.2.0
      - name: Fetch the plugin branch the marketplace entry points at
        run: git fetch --no-tags --depth=1 origin +refs/heads/plugin:refs/remotes/origin/plugin
      - name: Check skills and the shipped plugin tree
        continue-on-error: true
        run: skill-linter release
      - name: Check stamped counts and versions
        continue-on-error: true
        run: skill-linter stamp --check

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --prefix site
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: Check Astro formatting
        run: cd site && npx prettier --plugin prettier-plugin-astro --check "src/**/*.astro"
      - name: Check Markdown formatting
        run: npx prettier --check "skills/**/*.md" "docs/**/*.md" "*.md" "research/**/*.md"
