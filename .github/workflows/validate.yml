name: Validate Skills

on:
  workflow_call:

jobs:
  validate:
    name: Validate Skills & Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Set up uv (the plugin's hooks run the guard through uv)
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install skill-linter
        run: pip install skill-linter==0.5.0

      - name: Check skills and the shipped plugin tree
        run: skill-linter release

      - name: Check stamped counts and versions
        run: skill-linter stamp --check

      - name: Test the plugin tree
        run: bash scripts/test-plugin-tree.sh

      - name: Test that the docs match the commands
        run: bash scripts/test-command-docs.sh

      - name: Test that the doc links and anchors resolve
        run: bash scripts/test-doc-links.sh

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --prefix site
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: Check Astro formatting
        run: cd site && npx prettier --plugin prettier-plugin-astro --check "src/**/*.astro"
