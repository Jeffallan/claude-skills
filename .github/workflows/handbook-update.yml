# Delivered by the handbook (Copier). Opens a PR when a new handbook version is available.
# Triggered by the handbook's publish workflow, with a weekly check in case a push is missed.
# Needs the handbook GitHub App: variable HANDBOOK_APP_ID and secret HANDBOOK_APP_PRIVATE_KEY.
# A repo in an org also needs that org's own app: variable ORG_APP_ID and secret ORG_APP_PRIVATE_KEY.
# Until HANDBOOK_APP_ID is set, the job is skipped instead of failing.
name: Handbook update

on:
  repository_dispatch:
    types: [handbook-updated]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: vars.HANDBOOK_APP_ID != ''
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    env:
      UV_LINK_MODE: copy  # uv's clone into its cache hits EAGAIN (os error 11) on self-hosted NAS runners
    steps:
      # Two tokens, so a repo outside Jeffallan (an org repo) can take the handbook too: the handbook
      # app reads the private handbook; the org's own app (ORG_APP_ID, when set) writes to this repo.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: handbook
        with:
          app-id: ${{ vars.HANDBOOK_APP_ID }}
          private-key: ${{ secrets.HANDBOOK_APP_PRIVATE_KEY }}
          owner: Jeffallan
          repositories: handbook
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.ORG_APP_ID || vars.HANDBOOK_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY || secrets.HANDBOOK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          # A kept token would go to every github.com URL, so copier would read the handbook with the org app
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Let git read the private handbook
        # In $GITHUB_ENV, not ~/.gitconfig: a self-hosted runner keeps ~/.gitconfig, and git would use an old token.
        # Entries written there by earlier runs still win over $GITHUB_ENV, so remove them first.
        run: |
          { git config --global --get-regexp '^url\..*\.insteadof$' '^https://github.com/Jeffallan/handbook$' || true; } | cut -d' ' -f1 | xargs -r -n1 git config --global --unset-all
          echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${{ steps.handbook.outputs.token }}@github.com/Jeffallan/handbook.insteadOf" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=https://github.com/Jeffallan/handbook" >> "$GITHUB_ENV"
      - name: Check for a new handbook version
        id: check
        run: |
          uvx copier check-update --output-format json > check.json
          echo "available=$(jq -r .update_available check.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .latest_version check.json)" >> "$GITHUB_OUTPUT"
          rm check.json
      - name: Update from the handbook
        if: steps.check.outputs.available == 'true'
        # --trust: the handbook runs personal-sites/versions.mjs to carry the shared site package versions
        run: uvx copier update --defaults --trust
      - name: Open the update PR
        if: steps.check.outputs.available == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          branch: handbook/update
          commit-message: "chore: update handbook to v${{ steps.check.outputs.version }}"
          title: "Update handbook to v${{ steps.check.outputs.version }}"
          body: |
            Copier update from the handbook, v${{ steps.check.outputs.version }}.
            Conflict markers, if any, mark places where a local edit and the handbook changed the same lines.
