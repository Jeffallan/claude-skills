version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The handbook delivers these workflows and bumps their actions (action-pins.yml there).
    exclude-paths:
      - ".github/workflows/handbook-update.yml"
      - ".github/workflows/docs-site.yml"
      - ".github/workflows/docs-deploy.yml"
